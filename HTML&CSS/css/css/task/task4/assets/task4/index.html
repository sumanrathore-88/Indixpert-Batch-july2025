<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flex Justify Content</title>

<style>
    body {
        margin: 0;
        padding: 25px;
        background: #ffffff;
    }

    .wrapper {
        border: 3px solid #5aa0d6;
        padding: 24px;
        max-width: 900px;
        box-sizing: border-box;
    }

    .row {
        display: flex;
        justify-content:space-between;
        margin-bottom: 22px;
    }

    .row:last-child {
        margin-bottom: 0;
    }

    .box {
        background: #557a9e;
        color: #fff;
        font-size: 22px;
        padding: 18px 34px;
        border-radius: 14px;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
        white-space: nowrap;

        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
</head>

<body>

<div class="wrapper">

    
    <div class="row">
        <div class="box">Turnip</div>
        <div class="box">greens</div>
        <div class="box">yarrow</div>
        <div class="box">ricebean</div>
    </div>

    
    <div class="row">
        <div class="box">rutabaga</div>
        <div class="box">endive</div>
        <div class="box">cauliflower</div>
    </div>

    
    <div class="row">
        <div class="box">sea lettuce</div>
        <div class="box">kohlrabi</div>
        <div class="box">amaranth</div>
    </div>

</div>

</body>
</html>

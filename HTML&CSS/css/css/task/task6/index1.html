<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotate, Scale, Skew Demo</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      
    }

    .box {
      width: 150px;
      height: 150px;
      background-color: rgb(91, 91, 116);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;

    
      rotate: 30deg;
      scale: 1.2;
      skew: 15deg 5deg;

    }

    .box:hover {
      rotate: 0deg;
      scale: 1;
      skew: 0deg 0deg;
      background-color: tomato;
    }
  </style>
</head>
<body>

  <div class="box">
    Transform
  </div>

</body>
</html>

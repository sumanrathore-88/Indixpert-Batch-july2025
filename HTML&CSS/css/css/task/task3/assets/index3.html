<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>

    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <div class="card">
        <span class="online-badge">Online</span>

        
        <div class="avatar-wrapper">
            <img src="./images/profile-image.png" alt="Profile Image" class="avatar">
        </div>

        <h2>Alex Johnson</h2>
        <p class="title">Web Developer</p>

        <div class="bio">
            Passionate web developer with over 8 years of experience in building
            responsive and user-friendly websites. Enjoys coding, traveling and
            exploring new technologies. Always eager to learn and take on new
            challenges in the world of web development.
        </div>

        <div class="buttons">
            <button class="btn follow">Follow</button>
            <button class="btn message">Message</button>
        </div>
    </div>

</body>
</html>

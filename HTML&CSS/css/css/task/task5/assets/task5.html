<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery Layout</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 4px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #9b9b9b;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
    }

  
    .card:last-child {
      grid-column: 1 / 2;
    }

    
    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .card:last-child {
        grid-column: auto;
      }
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="gallery">
    
    <div class="card">
      <img src="https://images.unsplash.com/photo-1504196606672-aef5c9cefc92" alt="Red balloon">
      <div class="tags">
        <span class="tag">balloon</span>
        <span class="tag">red</span>
        <span class="tag">sky</span>
        <span class="tag">blue</span>
        <span class="tag">Hot air balloon</span>
      </div>
    </div>

    
    <div class="card">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Train and balloons">
      <div class="tags">
        <span class="tag">balloons</span>
        <span class="tag">houses</span>
        <span class="tag">train</span>
        <span class="tag">harborside</span>
      </div>
    </div>

    
    <div class="card">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Inflating balloon">
      <div class="tags">
        <span class="tag">balloons</span>
        <span class="tag">inflating</span>
        <span class="tag">green</span>
        <span class="tag">blue</span>
      </div>
    </div>

  
    <div class="card">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Balloon and sun">
      <div class="tags">
        <span class="tag">balloon</span>
        <span class="tag">sun</span>
        <span class="tag">sky</span>
        <span class="tag">summer</span>
        <span class="tag">bright</span>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Grid Overlap Example</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 120px);
      gap: 10px;
      border: 2px solid #4da3ff;
      padding: 10px;
    }

    .item-one {
      grid-column: 1 / 4;
      grid-row: 1 / 3;
      background-color: rgba(90, 120, 130, 0.85);
      color: white;
      padding: 15px;
      border-radius: 8px;
    }

    .item-two {
      grid-column: 2 / 6;
      grid-row: 2 / 4;
      background-color: rgba(220, 150, 150, 0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
      z-index: 1; 
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="item-one">One</div>
    <div class="item-two">Two</div>
  </div>

</body>
</html>
